Options:
  Output:
    Description: Core audio output configuration
    Options:
      Channels:
        Type: choice
        DisplayName: Channel Configuration
        Description: 'channels: Sets the default output channel configuration. If left unspecified, one will try to be detected from the system, with a fallback to stereo. The available values are: mono, stereo, quad, surround51, surround61, surround71, surround714, 3d71, ambi1, ambi2, ambi3, ambi4. Note that the ambi* configurations output ambisonic channels of the given order (using ACN ordering and SN3D normalization by default), which need to be decoded to play correctly on speakers.'
        Choices:
        - mono
        - stereo
        - quad
        - surround51
        - surround61
        - surround71
        - surround714
        - 3d71
        - ambi1
        - ambi2
        - ambi3
        - ambi4
      Sample_type:
        Type: choice
        DisplayName: Output Sample Type
        Description: 'sample-type: Sets the default output sample type. Currently, all mixing is done with 32-bit float and converted to the output sample type as needed. Available values are: int8    - signed 8-bit int uint8   - unsigned 8-bit int int16   - signed 16-bit int uint16  - unsigned 16-bit int int32   - signed 32-bit int uint32  - unsigned 32-bit int float32 - 32-bit float'
        Default: float32
        Choices:
        - int8
        - uint8
        - int16
        - uint16
        - int32
        - uint32
        - float32
      Frequency:
        Type: string
        DisplayName: Output Sample Rate
        Description: |
          Output sample rate in Hz. Leave empty to follow the system mixer; forcing a rate the device does not support only introduces resampling.
      Stereo_mode:
        Type: string
        Description: 'stereo-mode: Specifies if stereo output is treated as being headphones or speakers. With headphones, HRTF or crossfeed filters may be used for better audio quality. Valid settings are auto, speakers, and headphones.'
        Default: auto
      Stereo_encoding:
        Type: choice
        DisplayName: Stereo Encoding
        Description: 'stereo-encoding: Specifies the default encoding method for stereo output. Valid values are: basic - Standard amplitude panning (aka pair-wise, stereo pair, etc) between -30 and +30 degrees. uhj - Creates a stereo-compatible two-channel UHJ mix, which encodes some continuous surround sound information into stereo output that can be decoded with a surround sound receiver. tsme - Creates a stereo-compatible two-channel surround matrix encoded mix, which encodes some discrete surround sound and height information into the stereo output that can be decoded with a surround sound receiver. hrtf - Uses filters to provide better spatialization of sounds while using stereo headphones. If crossfeed filters are used, basic stereo mixing is used.'
        Default: basic
        Choices:
        - basic
        - uhj
        - tsme
        - hrtf
      Ambi_format:
        Type: string
        Description: 'ambi-format: Specifies the channel order and normalization for the "ambi*" set of channel configurations. Valid settings are: fuma, acn+fuma, ambix (or acn+sn3d), or acn+n3d'
        Default: ambix
  Hrtf:
    DisplayName: HRTF
    Description: Head-related transfer function, for positional audio over headphones
    Options:
      Hrtf:
        Type: choice
        DisplayName: HRTF Mode
        Description: 'hrtf: Deprecated. Consider using stereo-encoding instead. Valid values are auto, off, and on.'
        Default: auto
        Choices:
        - auto
        - "off"
        - and on
      Hrtf_mode:
        Type: string
        Description: 'hrtf-mode: Specifies the rendering mode for HRTF processing. Setting the mode to full (default) applies a unique HRIR filter to each source given its relative location, providing the clearest directional response at the cost of the highest CPU usage. Setting the mode to ambi1, ambi2, ambi3, or ambi4 will instead mix to an ambisonic buffer of the given order, then decode that buffer with HRTF filters. Ambi1 has the lowest CPU usage, replacing the per- source HRIR filter for a simple 4-channel panning mix, but retains full 3D placement at the cost of a more diffuse response. Higher ambisonic orders increasingly improve the directional clarity, at the cost of more CPU usage (still less than "full", given some number of active sources).'
        Default: full
      Default_hrtf:
        Type: string
        Description: 'default-hrtf: Specifies the default HRTF to use. When multiple HRTFs are available, this determines the preferred one to use if none are specifically requested. Note that this is the enumerated HRTF name, not necessarily the filename.'
  Performance:
    Description: Buffering and mixing quality
    Options:
      Period_size:
        Type: string
        Description: 'period_size: Sets the update period size, in sample frames. This is the number of frames needed for each mixing update. Acceptable values range between 64 and 8192. If left unspecified it will default to 512 sample frames (~10.7ms).'
      Periods:
        Type: int
        Description: 'periods: Sets the number of update periods. Higher values create a larger mix ahead, which helps protect against skips when the CPU is under load, but increases the delay between a sound getting mixed and being heard. Acceptable values range between 2 and 16.'
        Default: "3"
      Resampler:
        Type: choice
        DisplayName: Resampler
        Description: 'resampler: (global) Selects the default resampler used when mixing sources. Valid values are: point - nearest sample, no interpolation linear - extrapolates samples using a linear slope between samples spline - extrapolates samples using a Catmull-Rom spline gaussian - extrapolates samples using a 4-point Gaussian filter bsinc12 - extrapolates samples using a band-limited Sinc filter (varying between 12 and 24 points, with anti-aliasing) fast_bsinc12 - same as bsinc12, except without interpolation between down- sampling scales bsinc24 - extrapolates samples using a band-limited Sinc filter (varying between 24 and 48 points, with anti-aliasing) fast_bsinc24 - same as bsinc24, except without interpolation between down- sampling scales bsinc48 - extrapolates samples using a band-limited Sinc filter (48 points, with anti-aliasing) fast_bsinc48 - same as bsinc48, except without interpolation between down- sampling scales'
        Default: spline
        Choices:
        - point
        - linear
        - spline
        - gaussian
        - bsinc12
        - fast_bsinc12
        - bsinc24
        - fast_bsinc24
        - bsinc48
        - fast_bsinc48
      Sources:
        Type: int
        DisplayName: Maximum Sources
        Description: |
          Maximum number of simultaneous sources. Older titles rarely need more than the default, and raising it costs CPU.
        Default: "256"
      Slots:
        Type: int
        Description: 'slots: Sets the maximum number of Auxiliary Effect Slots an app can create. A slot can use a non-negligible amount of CPU time if an effect is set on it even if no sources are feeding it, so this may help when apps use more than the system can handle.'
        Default: "64"
  General:
    Options:
      Disable_cpu_exts:
        Type: string
        Description: "disable-cpu-exts: (global) Disables use of specialized methods that use specific CPU intrinsics. Certain methods may utilize CPU extensions for improved performance, and this option is useful for preventing some or all of those methods from being used. The available extensions are: sse, sse2, sse3, sse4.1, and neon. Specifying 'all' disables use of all such specialized methods."
      Drivers:
        Type: string
        DisplayName: Backend Order
        Description: |
          Comma-separated backend priority. Leave empty to try all available backends, which is almost always correct on Windows.
      Hrtf_size:
        Type: int
        Description: 'hrtf-size: Specifies the impulse response size, in samples, for the HRTF filter. Larger values increase the filter quality, while smaller values reduce processing cost. A value of 0 (default) uses the full filter size in the dataset, and the default dataset has a filter size of 64 samples at 48khz.'
        Default: "0"
      Hrtf_paths:
        Type: string
        Description: "hrtf-paths: Specifies a comma-separated list of paths containing HRTF data sets. The format of the files are described in docs/hrtf.txt. The files within the directories must have the .mhr file extension to be recognized. By default, OS-dependent data paths will be used. They will also be used if the list ends with a comma. On Windows this is: $AppData\\openal\\hrtf And on other systems, it's (in order): $XDG_DATA_HOME/openal/hrtf  (defaults to $HOME/.local/share/openal/hrtf) $XDG_DATA_DIRS/openal/hrtf  (defaults to /usr/local/share/openal/hrtf and /usr/share/openal/hrtf)"
      Cf_level:
        Type: choice
        DisplayName: Crossfeed Level
        Description: |
          Crossfeed bleeds a little of each stereo channel into the other, which some listeners find more natural over headphones. No effect on non-stereo modes.
        Default: "0"
        Choices:
        - Value: "0"
          DisplayName: "Off"
        - Value: "1"
          DisplayName: Low
        - Value: "2"
          DisplayName: Middle
        - Value: "3"
          DisplayName: High
        - Value: "4"
          DisplayName: Low (easy)
        - Value: "5"
          DisplayName: Middle (easy)
        - Value: "6"
          DisplayName: High (easy)
      Rt_prio:
        Type: int
        Description: 'rt-prio: (global) Sets the real-time priority value for the mixing thread. Not all drivers may use this (eg. PortAudio) as those APIs already control the priority of the mixing thread. 0 and negative values will disable real-time priority. Note that this may constitute a security risk since a real-time priority thread can indefinitely block normal-priority threads if it fails to wait. Disable this if it turns out to be a problem.'
        Default: "1"
      Rt_time_limit:
        Type: bool
        Description: "rt-time-limit: (global) On non-Windows systems, allows reducing the process's RLIMIT_RTTIME resource as necessary for acquiring real-time priority from RTKit."
        Default: "true"
      Sends:
        Type: int
        Description: 'sends: Limits the number of auxiliary sends allowed per source. Setting this higher than the default has no effect.'
        Default: "6"
      Front_stablizer:
        Type: bool
        Description: 'front-stablizer: Applies filters to "stablize" front sound imaging. A psychoacoustic method is used to generate a front-center channel signal from the front-left and front-right channels, improving the front response by reducing the combing artifacts and phase errors. Consequently, it will only work with channel configurations that include front-left, front-right, and front-center.'
        Default: "false"
      Output_limiter:
        Type: string
        Description: 'output-limiter: Applies a gain limiter on the final mixed output. This reduces the volume when the output samples would otherwise clamp, avoiding excessive clipping noise. On by default for integer sample types, and off by default for floating-point.'
      Dither:
        Type: string
        Description: 'dither: Applies dithering on the final mix, enabled by default for 8- and 16-bit output. This replaces the distortion created by nearest-value quantization with low-level whitenoise.'
      Dither_depth:
        Type: int
        Description: "dither-depth: Quantization bit-depth for dithered output. A value of 0 (or less) will match the output sample depth. For int32, uint32, and float32 output, 0 will disable dithering because they're at or beyond the rendered precision. The maximum dither depth is 24."
        Default: "0"
      Volume_adjust:
        Type: int
        Description: 'volume-adjust: A global volume adjustment for source output, expressed in decibels. The value is logarithmic, so +6 will be a scale of (approximately) 2x, +12 will be a scale of 4x, etc. Similarly, -6 will be x1/2, and -12 is about x1/4. A value of 0 means no change.'
        Default: "0"
      Excludefx:
        Type: string
        Description: 'excludefx: (global) Sets which effects to exclude, preventing apps from using them. This can help for apps that try to use effects which are too CPU intensive for the system to handle. Available effects are: eaxreverb,reverb,autowah,chorus, compressor,distortion,echo,equalizer,flanger,modulator,dedicated,pshifter, fshifter,vmorpher.'
      Default_reverb:
        Type: string
        Description: 'default-reverb: (global) A reverb preset that applies by default to all sources on send 0 (applications that set their own slots on send 0 will override this). Available presets include: None, Generic, PaddedCell, Room, Bathroom, Livingroom, Stoneroom, Auditorium, ConcertHall, Cave, Arena, Hangar, CarpetedHallway, Hallway, StoneCorridor, Alley, Forest, City, Mountains, Quarry, Plain, ParkingLot, SewerPipe, Underwater, Drugged, Dizzy, Psychotic.'
      Trap_alc_error:
        Type: bool
        Description: 'trap-alc-error: (global) Generates a SIGTRAP signal when an ALC device error is generated, on systems that support it. This helps when debugging, while trying to find the cause of a device error. On Windows, a breakpoint exception is generated.'
        Default: "false"
      Trap_al_error:
        Type: bool
        Description: 'trap-al-error: (global) Generates a SIGTRAP signal when an AL context error is generated, on systems that support it. This helps when debugging, while trying to find the cause of a context error. On Windows, a breakpoint exception is generated.'
        Default: "false"
  Decoder:
    Options:
      Hq_mode:
        Type: bool
        Description: 'hq-mode: Enables a high-quality ambisonic decoder. This mode is capable of frequency- dependent processing, creating a better reproduction of 3D sound rendering over surround sound speakers.'
        Default: "true"
      Distance_comp:
        Type: bool
        Description: "distance-comp: Enables compensation for the speakers' relative distances to the listener. This applies the necessary delays and attenuation to make the speakers behave as though they are all equidistant, which is important for proper playback of 3D sound rendering. Requires the proper distances to be specified in the decoder configuration file."
        Default: "true"
      Nfc:
        Type: bool
        Description: "nfc: Enables near-field control filters. This simulates and compensates for low- frequency effects caused by the curvature of nearby sound-waves, which creates a more realistic perception of sound distance with surround sound output. Note that the effect may be stronger or weaker than intended if the application doesn't use or specify an appropriate unit scale, or if incorrect speaker distances are set. For HRTF output, hrtf-mode must be set to one of the ambi* values for this to function."
        Default: "false"
      Delay_seconds:
        Type: string
        Description: 'speaker-dist: Specifies the speaker distance in meters, used by the near-field control filters with surround sound output. For ambisonic output modes, this value is the basis for the NFC-HOA Reference Delay parameter (calculated as'
        Default: speaker_dist/343.3). This value is not used when a decoder
      Speaker_dist:
        Type: int
        Description: configuration is set for the output mode (since they specify the per-speaker distances, overriding this setting), or when the NFC filters are off. Valid values range from 0.1 to 10.
        Default: "1"
      Quad:
        Type: string
        Description: 'quad: Decoder configuration file for Quadraphonic channel output. See docs/ambdec.txt for a description of the file format.'
      Surround51:
        Type: string
        Description: 'surround51: Decoder configuration file for 5.1 Surround (Side and Rear) channel output. See docs/ambdec.txt for a description of the file format.'
      Surround61:
        Type: string
        Description: 'surround61: Decoder configuration file for 6.1 Surround channel output. See docs/ambdec.txt for a description of the file format.'
      Surround71:
        Type: string
        Description: 'surround71: Decoder configuration file for 7.1 Surround channel output. See docs/ambdec.txt for a description of the file format.'
      Surround714:
        Type: string
        Description: 'surround714: Decoder configuration file for 7.1.4 Surround channel output. See docs/ambdec.txt for a description of the file format.'
      3d71:
        Type: string
        Description: '3d71: Decoder configuration file for 3D7.1 channel output. See docs/ambdec.txt for a description of the file format. See also docs/3D7.1.txt for information about 3D7.1.'
  Uhj:
    Options:
      Decode_filter:
        Type: choice
        DisplayName: UHJ Decode Filter
        Description: 'decode-filter: (global) Specifies the all-pass filter type for UHJ decoding and Super Stereo processing. Valid values are: iir - utilizes dual IIR filters, providing a wide pass-band with low CPU use, but causes additional phase shifts on the signal. fir256 - utilizes a 256-point FIR filter, providing more stable results but exhibiting attenuation in the lower and higher frequency bands. fir512 - utilizes a 512-point FIR filter, providing a wider pass-band than fir256, at the cost of more CPU use.'
        Default: iir
        Choices:
        - iir
        - fir256
        - fir512
      Encode_filter:
        Type: choice
        DisplayName: UHJ Encode Filter
        Description: 'encode-filter: (global) Specifies the all-pass filter type for UHJ output encoding. Valid values are the same as for decode-filter.'
        Default: iir
        Choices:
        - iir
        - fir256
        - fir512
  Tsme:
    Options:
      Encode_filter:
        Type: choice
        DisplayName: Surround Matrix Encode Filter
        Description: 'encode-filter: (global) Specifies the all-pass filter type for TSME output encoding. Valid values are: iir - utilizes dual IIR filters, providing a wide pass-band with low CPU use, but causes additional phase shifts on the signal. fir256 - utilizes a 256-point FIR filter, providing more stable results but exhibiting attenuation in the lower and higher frequency bands. fir512 - utilizes a 512-point FIR filter, providing a wider pass-band than fir256, at the cost of more CPU use.'
        Default: iir
        Choices:
        - iir
        - fir256
        - fir512
  Reverb:
    Options:
      Boost:
        Type: int
        Description: 'boost: (global) A global amplification for reverb output, expressed in decibels. The value is logarithmic, so +6 will be a scale of (approximately) 2x, +12 will be a scale of 4x, etc. Similarly, -6 will be about half, and -12 about 1/4th. A value of 0 means no change.'
        Default: "0"
  Wasapi:
    Options:
      Spatial_api:
        Type: bool
        Description: 'spatial-api: Specifies whether to use a Spatial Audio stream for playback. This may provide expanded capabilities for surround sound and with-height speaker configurations. Very experimental.'
        Default: "false"
      Exclusive_mode:
        Type: bool
        Description: 'exclusive-mode: Enables Exlusive mode for playback devices. This uses the device directly, allowing lower latencies but prevents the device from being used multiple times simultaneously. Ignores the periods setting when enabled, as WASAPI automatically sets a buffer size based on the period size.'
        Default: "false"
      Allow_resampler:
        Type: bool
        Description: 'allow-resampler: Specifies whether to allow an extra resampler pass on the output. Enabling this will allow the playback device to be set to a different sample rate than the actual output can accept, causing the backend to apply its own resampling pass after OpenAL Soft mixes the sources and processes effects for output.'
        Default: "true"
  Wave:
    Options:
      File:
        Type: string
        Description: 'file: (global) Sets the filename of the wave file to write to. An empty name prevents the backend from opening, even when explicitly requested. THIS WILL OVERWRITE EXISTING FILES WITHOUT QUESTION!'
      Format:
        Type: string
        Description: 'format: (global) Specifies the output file format. Available options: wav - Microsoft RIFF WAVE with WAVE_FORMAT_EXTENSIBLE format. caf - Apple Core Audio Format When outputing ambisonic format (one of the ambi* channel configurations), wav will be .amb format and caf will be .ambix format.'
        Default: wav
      Bformat:
        Type: bool
        Description: 'bformat: (global) Creates .amb (for wav) or .ambix (for caf) format files using B-Format instead of a standard single- or multi-channel .wav file.'
        Default: "false"
  Eax:
    Options:
      Enable:
        Type: bool
        Description: 'enable: (global) Sets whether to enable EAX extensions or not.'
        Default: "true"
      Trace_commits:
        Type: bool
        Description: 'trace-commits: (global) Sets whether log EAX property commits with trace messages. This can significantly increase the amount of log messages for apps that use EAX.'
        Default: "false"
  Game_compat:
    Options:
      Default_error:
        Type: string
        Description: "default-error: (global) An error value returned by alGetError when there's no current context. The default value is AL_INVALID_OPERATION, which lets the caller know the operation could not be executed. Some applications may erroneously call alGetError without a current context and expect 0 (AL_NO_ERROR), however that may cause other applications to think earlier AL calls succeeded when they actually failed."
        Default: 0xA004
      Nfc_scale:
        Type: int
        Description: "nfc-scale: (global) A meters-per-unit distance scale applied to NFC filters. If a game doesn't use real-world meters for in-game units, the filters may create a too-near or too-distant effect. For instance, if the game uses 1 foot per unit, a value of 0.3048 will correctly adjust the filters. Or if the game uses 1 kilometer per unit, a value of 1000 will correctly adjust the filters."
        Default: "1"
      Enable_sub_data_ext:
        Type: bool
        Description: 'enable-sub-data-ext: (global) Enables the AL_SOFT_buffer_sub_data extension, disabling the AL_EXT_SOURCE_RADIUS extension. These extensions are incompatible, so only one can be available. The latter extension is more commonly used, but this option can be enabled for older apps that want the former extension.'
        Default: "false"
      Reverse_x:
        Type: bool
        Description: 'reverse-x: (global) Reverses the local X (left-right) position of 3D sound sources.'
        Default: "false"
      Reverse_y:
        Type: bool
        Description: 'reverse-y: (global) Reverses the local Y (up-down) position of 3D sound sources.'
        Default: "false"
      Reverse_z:
        Type: bool
        Description: 'reverse-z: (global) Reverses the local Z (front-back) position of 3D sound sources.'
        Default: "false"
      Vendor_override:
        Type: string
        Description: 'vendor-override: Overrides the string returned by alGetString(AL_VENDOR).'
      Version_override:
        Type: string
        Description: 'version-override: Overrides the string returned by alGetString(AL_VERSION).'
      Renderer_override:
        Type: string
        Description: 'renderer-override: Overrides the string returned by alGetString(AL_RENDERER).'
